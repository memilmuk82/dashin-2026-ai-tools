<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 실습 기록지 · 대신고 2026</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../assets/reference-style.css"><link rel="stylesheet" href="../assets/course.css?v=course42-full2"></head><body ><a class="skip" href="#main">본문으로 이동</a><header class="site-header"><a class="brand" href="../index.html">대신고 · AI 업무 도구</a><nav aria-label="주 메뉴"><a href="../index.html">시작</a><a href="../slides.html">발표</a><a href="../selfstudy.html">혼자 시작</a><a href="../guide.html">상세 교안</a><a href="../practice/index.html">실습자료</a><a href="../resources.html">참고자료</a><button data-print>인쇄</button></nav></header><main class="page-shell worksheet" id="main"><h1>내 실습 기록지</h1><p>입력은 자동 저장하지 않습니다. 개인정보·API 키를 적지 말고 현재 입력을 복사·내려받기·인쇄해 보관하세요.</p><form id="worksheet"><label for="task">내 업무: 누가 / 무엇을 입력 / 어떤 결과</label><textarea id="task" name="task" data-print-field></textarea><label for="source">원문 제목·연도·쪽/항목·URL·확인일·공개 가능 범위</label><textarea id="source" name="source" data-print-field></textarea><label for="path">선택한 서비스·플랜·모델·실행일</label><textarea id="path" name="path" data-print-field></textarea><label for="change">수정 전 문제 / 수정 요청 / 재검사 결과</label><textarea id="change" name="change" data-print-field></textarea><label for="result">통과한 기능 / 남은 오류 / 다음 업무 한 건</label><textarea id="result" name="result" data-print-field></textarea></form><div class="actions"><button id="download-record">기록 내려받기</button><button data-print>인쇄</button><button id="clear-record">입력 비우기</button></div><p id="record-status" role="status"></p><a href="index.html">실습자료로 →</a></main><script src="../assets/records.js"></script><dialog id="picture-viewer" aria-labelledby="picture-title"><div class="viewer-heading"><h2 id="picture-title">화면 확대</h2><button data-picture-close aria-label="확대 화면 닫기">닫기 ×</button></div><div class="viewer-controls"><div class="view-modes" role="group" aria-label="볼 범위"><button data-view-mode="context" aria-pressed="true">전체 화면</button><button data-view-mode="detail" aria-pressed="false">부분 확대(보조)</button></div><div class="zoom-controls"><button data-zoom-step="-1" aria-label="축소">−</button><label>배율 <input id="picture-scale" type="range" min="5" max="400" value="100" step="1"></label><output id="picture-percent">100%</output><button data-zoom-step="1" aria-label="확대">＋</button><button id="picture-fit">화면에 맞춤</button><button id="picture-original">원본 100%</button></div></div><div id="picture-scroll" tabindex="0" aria-label="확대 이미지. 스크롤하거나 끌어서 이동"><img id="picture-image" alt="" draggable="false"></div><p class="viewer-help">전체 위치와 조작 부분을 전환할 수 있습니다. 크게 확대한 뒤 스크롤하거나 끌어서 읽으세요. Esc로 닫습니다.</p></dialog><div id="toast" role="status" aria-live="polite"></div><script src="../assets/course-app.js?v=course42-full2"></script></body></html>
