<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>내 실습 기록지 · 대신고 2026</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../assets/reference-style.css"><link rel="stylesheet" href="../assets/training.css?v=screens3"></head><body ><a class="skip" href="#main">본문으로 이동</a><header class="site-header"><a class="brand" href="../index.html">대신고 · AI 업무 도구</a><nav aria-label="주 메뉴"><a href="../slides.html">발표</a><a href="../guide.html">상세 교안</a><a href="../practice/index.html">실습 자료</a><a href="../resources.html">참고 링크</a><button data-print>인쇄</button></nav></header><main class="page-shell worksheet" id="main"><h1>내 실습 기록지</h1><p>입력은 자동 저장하지 않습니다. 개인정보·API 키를 적지 마세요. “기록 내려받기”로 현재 입력만 저장합니다.</p><form id="worksheet"><label for="task">내 업무: 누가 / 무엇을 입력 / 어떤 결과</label><textarea id="task" name="task" data-print-field></textarea><label for="source">원문 제목·공시연도·항목/쪽·URL·확인일·공개 가능 범위</label><textarea id="source" name="source" data-print-field></textarea><label for="path">선택한 서비스·무료/유료·모델·실행일</label><textarea id="path" name="path" data-print-field></textarea><label for="change">수정 전 문제와 실제 수정 요청</label><textarea id="change" name="change" data-print-field></textarea><label for="result">통과한 테스트·남은 오류·다음 행동</label><textarea id="result" name="result" data-print-field></textarea></form><div class="actions"><button id="download-record">기록 내려받기</button><button data-print>기록 인쇄</button><button id="clear-record">입력 비우기</button></div><p id="record-status" role="status"></p><a href="index.html">실습자료로 →</a></main><script src="../assets/records.js"></script><dialog id="screen-view" aria-labelledby="screen-view-title"><div class="dialog-head"><h2 id="screen-view-title">화면 크게 보기</h2><button data-zoom-close>닫기 ×</button></div><p class="screen-view-caption"></p><div class="screen-view-scroll"><img alt=""></div><p class="small">작은 화면에서는 이미지를 가로로 밀어 읽을 수 있습니다. Esc 키로 닫습니다.</p></dialog><div id="toast" role="status" aria-live="polite"></div><script src="../assets/app.js?v=screens3"></script></body></html>
