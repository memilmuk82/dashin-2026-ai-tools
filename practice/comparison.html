er" aria-labelledby="picture-title"><div class="viewer-heading"><h2 id="picture-title">화면 확대</h2><button data-picture-close aria-label="확대 화면 닫기">닫기 ×</button></div><div class="viewer-controls"><div class="view-modes" role="group" aria-label="볼 범위"><button data-view-mode="context" aria-pressed="true">전체 화면</button><button data-view-mode="detail" aria-pressed="false">부분 확대(보조)</button></div><div class="zoom-controls"><button data-zoom-step="-1" aria-label="축소">−</button><label>배율 <input id="picture-scale" type="range" min="5" max="400" value="100" step="1"></label><output id="picture-percent">100%</output><button data-zoom-step="1" aria-label="확대">＋</button><button id="picture-fit">화면에 맞춤</button><button id="picture-original">원본 100%</button></div></div><div id="picture-scroll" tabindex="0" aria-label="확대 이미지. 스크롤하거나 끌어서 이동"><img id="picture-image" alt="" draggable="false"></div><p class="viewer-help">전체 위치와 조작 부분을 전환할 수 있습니다. 크게 확대한 뒤 스크롤하거나 끌어서 읽으세요. Esc로 닫습니다.</p></dialog><div id="toast" role="status" aria-live="polite"></div><script src="../assets/course-app.js?v=course42-map1"></script></body></html>
